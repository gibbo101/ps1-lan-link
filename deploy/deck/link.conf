# PS1 LAN Link peer config. Edit ROLE/HOST to change who this Deck links to;
# the Game Mode shortcut (ps1-link.sh) never has to change.
#   ROLE=client  -> connect out to HOST:PORT   (use for the Deck when desktop/other Deck is server)
#   ROLE=server  -> listen on PORT for the peer to connect
ROLE=client
HOST=192.168.0.106
PORT=6699
# ROLE=server listens on 0.0.0.0 so the remote peer can reach it; narrow it to the link interface's
# own address if this machine is on a network you would rather not serve the link to.
# BIND_ADDRESS=0.0.0.0

# Link stall tuning (µs of wall-time to wait on a blocked peer). Must exceed the peer's RTT:
# loopback ~microseconds, real LAN ~milliseconds. Early-returns when data arrives, so a high
# bound only costs the real RTT. Raise if the handshake still bounces to the main menu.
STALL_US=15000
# POLL_CYCLES=8000   # window that counts as "recently polled SIO_STAT"; default 8000

# Idle-vs-transfer trade-off. The stall runs its whole budget whenever the peer sends nothing, so a
# budget sized for LAN round trips costs nearly all the wall clock on screens that only poll the port
# (the main menu). Backing the budget off to a floor fixes that, but a transfer starting while backed
# off gets its replies too late to count, so link setup and in-game sync can die. No single setting is
# both fast when idle and reliable when transferring — choose which failure you prefer:
#
#   reliable link, slow menus (session-5 behaviour):  STALL_BACKOFF_AFTER=4294967295
#   fast menus, link setup may die:                   STALL_BACKOFF_AFTER=8
#
STALL_BACKOFF_AFTER=4294967295
# STALL_FLOOR_US=200      # budget once backed off
# STALL_PROBE_EVERY=16    # every Nth stall while backed off waits the full budget, to spot a transfer
# STALL_MAX_SHARE=100     # cap on stalling's share of wall time; below 100 breaks the handshake
