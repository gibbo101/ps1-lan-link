# The game catalogue: display name|cue file name|status
#
# status:  ok      validated working over the link
#          broken  shown but not selectable - the link protocol is not satisfied by the emulation
#          hidden  not shown at all (duplicate or mislabelled rips)
#
# A .cue in roms/ that is not listed here still appears, under its file name, as ok - new rips
# work without editing this file; this file exists to give the known ones honest names.
#
# "redalert-allies" is hidden because it is NOT Red Alert: the disc boots SLUS_006.65, which is
# Retaliation - a mislabelled rip of the same game as retaliation-allies.
#
# Doom was listed broken ("hangs at LOADING when linked") - that diagnosis was wrong. The rip was
# missing its 7 CD-audio tracks and boot-looped at LOADING with or without a link; with silent
# stub tracks in the cue it boots to gameplay. Music from CD audio is silent by construction.
C&C Red Alert: Retaliation|retaliation-allies.cue|ok
Dune 2000|dune2000.cue|ok
Doom|doom.cue|ok
(duplicate Retaliation rip)|redalert-allies.cue|hidden
